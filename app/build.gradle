plugins { id 'com.android.application' }
android {
    namespace 'org.clashledger.app'
    compileSdk 36
    defaultConfig { applicationId 'org.clashledger.app'; minSdk 26; targetSdk 36; versionCode 13; versionName '1.3.0'; testInstrumentationRunner (project.findProperty('testRunner') ?: 'org.clashledger.app.ImportSmoke') }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { test { resources.srcDir 'src/main/assets' } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
